org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official

# AGP 9.0 の built-in Kotlin は kotlin.sourceSets 経由でのソース追加を禁止するが、
# KSP プラグイン（2.2.10-2.0.2）は今もその方式で Room の生成コードを登録する。
# Kotlin 2.2.10 に対応する KSP はこの版が最後（次は Kotlin 2.3 系）なので、
# KSP を上げて回避することはできない。AGP が用意している移行用フラグで制約を外す。
#
# Kotlin / AGP を上げるときは、この行を消してビルドが通るか先に試すこと。
android.disallowKotlinSourceSets=false
